name: "CI/CD - Dev Container Features Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log Level (info/debug/trace)"
        required: true
        default: "info"

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell Script Linter
        uses: azohra/shell-linter@v0.8.0
        with:
          path: "src/**/*.sh"
          severity: "error"
        env:
          SHELLCHECK_OPTS: -e SC2072

      - name: Validate devcontainer-feature.json files
        uses: devcontainers/action@v1
        with:
          validate-only: "true"
          base-path-to-features: "./src"

  compute-matrix:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.set-matrix.outputs.features }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Affected Features
        id: set-matrix
        run: |
          # Check if running on main or triggered manually
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Targeting all features for comprehensive verification."
            FEATURES=$(ls src/ | jq -R . | jq -s -c .)
          else
            # Calculate changes relative to the target branch
            git fetch origin ${{ github.base_ref }} --depth=1
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
            AFFECTED=$(echo "$CHANGED_FILES" | grep '^src/' | cut -d'/' -f2 | sort -u | jq -R . | jq -s -c .)
            
            if [ "$AFFECTED" = "[]" ] || [ -z "$AFFECTED" ]; then
              echo "No explicit feature directories changed. Defaulting to comprehensive test run."
              FEATURES=$(ls src/ | jq -R . | jq -s -c .)
            else
              FEATURES=$AFFECTED
            fi
          fi
          echo "Detected features matrix: ${FEATURES}"
          echo "features=${FEATURES}" >> $GITHUB_OUTPUT

  test-features:
    needs: [lint-and-validate, compute-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJson(needs.compute-matrix.outputs.features) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx (Max Caching Backend)
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=moby/buildkit:master

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Execute Feature Scenarios & Capture Artifacts
        run: |
          mkdir -p test-logs
          LOG_FILE="test-logs/${{ matrix.features }}-scenarios.log"

          echo "Running explicit scenario targets for feature: ${{ matrix.features }}"
          export DOCKER_BUILDKIT=1

          # Executes defined test scenarios
          devcontainer features test \
            -f ${{ matrix.features }} \
            . 2>&1 | tee "${LOG_FILE}"

      - name: Archive Execution Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.features }}-${{ strategy.job-index }}
          path: test-logs/
          retention-days: 7

  deploy-features:
    needs: test-features
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Publish Production Features
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          devcontainer-cli-version: "latest"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
